<ngx-header
  [home]="'/'"
  [name]="appname"
  [subname]="subname"
  [class]="theme"
  [logo]="applogo">
  <ng-template #actions let-actions>
    <div class="custom-header-actions"></div>
  </ng-template>
</ngx-header>

<div class="max-w-4xl mx-auto mt-10 bg-white rounded-2xl shadow-lg overflow-hidden">
  <div class="grid md:grid-cols-2">
    <div class="bg-gradient-to-br from-blue-500 to-blue-700 p-8 flex flex-col justify-center">
      <div class="text-white">
        <p cds-text class="text-xl text-center mb-4 text-custom-100">{{ name }}</p>
        <div class="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-8 p-2">
          <a *ngIf="logo" routerLink="/" >
            <img [attr.src]="logo" alt="AMU Logo" class="w-full h-full object-contain"/>
          </a>
        </div>
        <div class="text-center px-2">
        <h2 cds-text class="text-3xl font-bold">{{ description }}</h2>
        </div>
        <div class="mb-8 mt-6 space-y-2">
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
              <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <span class="text-custom-100">Déclaration rapide et sécurisée</span>
          </div>
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
              <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <span class="text-custom-100">Paiement mobile intégré</span>
          </div>
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-white bg-opacity-20 rounded-full flex items-center justify-center">
              <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <span class="text-custom-100">Suivi en temps réel</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column - Login Form -->
    <div class="p-8">
      <div class="max-w-md mx-auto">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-white-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </div>
          <h3 cds-text class="text-2xl font-bold text-gray-800 mb-2">Connexion</h3>
          <p cds-text class="text-gray-600">Accédez à votre espace CNSS</p>
        </div>

        <form #loginForm="ngForm" [formGroup]="formGroup" (ngSubmit)="onFormSubmit(formGroup)" class="space-y-4">
          <div class="mb-2">
            <label class="sr-only block text-sm font-medium text-gray-700 mb-2">{{ "auth.login.username.label" | text }} *</label>
            <input
              type="email"
              [class]="!!formGroup.get('username')?.touched && formGroup.get('username')?.errors !== null ? 'border-red-500' : 'border-gray-300'"
              class="w-full border-2 rounded-sm px-3 py-2 focus:border-primary-700 focus-within:border-primary-700 focus:outline-none rounded"
              name="username"
              [placeholder]="'auth.login.username.label' | text"
              formControlName="username"
              required
            />
          </div>

          <div class="mb-2 relative">
            <label class="sr-only block text-sm font-medium text-gray-700 mb-2">{{ "auth.login.password.label" | text }} </label>
            <input
              password
              type="password"
              [class]="!!formGroup.get('password')?.touched && formGroup.get('password')?.errors !== null ? 'border-red-500' : 'border-gray-300'"
              class="w-full border-2 px-3 py-2 focus:border-primary-700 focus-within:border-primary-700 focus:outline-none rounded"
              name="password"
              [placeholder]="'auth.login.password.label' | text"
              formControlName="password"
              required
            />
            <app-password-toggle class="block absolute transform -translate-y-1/2 top-1/4 right-2" (stateChange)="passwordInputRef?.setTypeAttribute($event)" [state]="'password'"></app-password-toggle>
          </div>

          <button [disabled]="performingAction" type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-lg transition duration-300">
            <div class="flex items-center justify-center" *ngIf="performingAction; else noAction">
              <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></div>
              <span>Connexion...</span>
            </div>
            <ng-template #noAction>
              <div class="flex items-center justify-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg> &nbsp;&nbsp;
                <span>{{ 'auth.login.submit' | text }}</span>
              </div>
            </ng-template>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
