<div class="login-wrapper">
  <div class="login-overlay" *ngIf="formGroup">
    <form class="login clr-form" #loginForm="ngForm" [formGroup]="formGroup" (ngSubmit)="onFormSubmit(formGroup)">
      <div class="company-infos">
        <div class="login-logo" *ngIf="logoAssetPath">
          <img alt="application-logo" [src]="logoAssetPath" [alt]="company" />
          <h3>{{ company }}</h3>
          <div class="company-description">{{ description }}</div>
        </div>
      </div>
      <div class="login-group">
        <div class="title">
          <span class="module-name">{{ module }}</span>
          <h5 class="hint">{{ service }}</h5>
        </div>
        <clr-input-container>
          <label class="clr-sr-only">{{ 'login.username.label' | text}}</label>
          <input aria-label="username" type="text" name="username" clrInput
            [placeholder]="'login.username.label' | text" formControlName="username" />
        </clr-input-container>
        <clr-password-container>
          <label class="clr-sr-only">{{'login.password.label' | text}}</label>
          <input aria-label="password" type="password" name="password" clrPassword
            [placeholder]="'login.password.label' | text" formControlName="password" />
        </clr-password-container>
        <clr-checkbox-wrapper *ngIf="hasRememberMe">
          <label>{{ 'login.remember.label'| text}}</label>
          <input aria-label="remember-me" type="checkbox" name="remember" clrCheckbox formControlName="remember" />
        </clr-checkbox-wrapper>
        <button title="sumit-button" type="submit" [disabled]="performingAction" class="btn btn-primary">{{
          'login.submit.text' | text}}</button>

        <div class="login-links">
          <!-- Login Links -->
        </div>
        <div class="app-login-footer">
          <div class="app-login-logo-description">Powered by LIKSOFT</div>
        </div>
      </div>
    </form>
  </div>
</div>
