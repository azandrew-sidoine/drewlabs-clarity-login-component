<div class="max-w-xl mx-auto mt-10 bg-white shadow-lg overflow-hidden">
  <!-- rounded-2xl -->
  <div class="p-12">
    <div class="max-w-md mx-auto">
      <p cds-text class="text-center text-2xl font-bold text-gray-800 mb-4">{{ name }}</p>
      <div class="text-center mb-8">
        <div class="flex items-center justify-center mx-auto mb-4">
          <a *ngIf="logo" routerLink="/" >
            <img [attr.src]="logo" alt="AMU Logo" class="w-full h-full object-contain"/>
          </a>
        </div>
      </div>
      <h2 cds-text class="text-3xl font-bold">{{ description }}</h2>

      <form #loginForm="ngForm" [formGroup]="formGroup" (ngSubmit)="onFormSubmit(formGroup)">
        <div class="mb-2">
          <label class="sr-only block text-sm font-medium text-gray-700 mb-2">{{ "auth.login.username.label" | text }} *</label>
          <input
            type="email"
            [class.has-error]="!!formGroup.get('username')?.touched && formGroup.get('username')?.errors !== null"
            class="w-full border-2 border-gray-300 rounded-sm px-3 py-2 focus:border-primary-700 focus-within:border-primary-700 focus:outline-none"
            name="username"
            [placeholder]="'auth.login.username.label' | text"
            formControlName="username"
            required
          />
        </div>

        <div class="mb-2 relative">
          <label class="sr-only block text-sm font-medium text-gray-700 mb-2">{{ "auth.login.password.label" | text }} </label>
          <input
            password
            type="password"
            [class.has-error]="!!formGroup.get('password')?.touched && formGroup.get('password')?.errors !== null"
            class="w-full border-2 border-gray-300 px-3 py-2 focus:border-primary-700 focus-within:border-primary-700 focus:outline-none"
            name="password"
            [placeholder]="'auth.login.password.label' | text"
            formControlName="password"
            required
          />
          <app-password-toggle class="block absolute transform -translate-y-1/2 top-1/4 right-2" (stateChange)="passwordInputRef?.setTypeAttribute($event)" [state]="'password'"></app-password-toggle>
        </div>

        <button [disabled]="performingAction" [class]="performingAction ? 'bg-primary-600' : 'bg-primary-800'" type="submit" class="space-y-6 w-full hover:bg-primary-900 text-white font-bold py-3 px-6 transition duration-300">
          <div class="flex items-center justify-center">
            <div *ngIf="performingAction; else noAction" class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
            <ng-template #noAction>
                <div class="flex items-center justify-center">
                  <svg
                    class="w-5 h-5 space-x-2"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                  </svg>
                </div>
            </ng-template> &nbsp; &nbsp;
            <span>{{ performingAction ? "  Connexion..." : ("auth.login.submit" | text) }}</span>
          </div>
        </button>
        <div class="text-center mt-4 text-xs text-gray-600">Powered by LIKSOFT</div>
      </form>
    </div>
  </div>
</div>
