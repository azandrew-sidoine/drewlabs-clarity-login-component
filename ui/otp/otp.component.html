<input
  #input
  *ngFor="let item of size | newarray : ''; let i = index"
  [disabled]="disabled"
  [last]="size - 1"
  [class.has-error]="error"
  (valueChange)="onValueChange(i, $event)"
  [value]="''"
  pattern="[a-zA-Z0-9]+"
  [otp]="i"
  class="input"
  type="text"
  inputmode="numeric"
  maxlength="1"
/>
